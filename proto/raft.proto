syntax = "proto3";

package kvstore.raft;

option go_package = "kvstore/proto/raftpb;raftpb";

// Inter-node RPCs. Field names follow Figure 2 of the Raft paper.
service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

enum EntryType {
  ENTRY_TYPE_NORMAL = 0; // client command for the state machine
  ENTRY_TYPE_CONFIG = 1; // cluster membership change (dissertation §4.1)
}

message LogEntry {
  uint64 term = 1;  // term when the entry was received by the leader
  uint64 index = 2; // position in the log (first index is 1)
  EntryType type = 3;
  bytes data = 4;   // command for the state machine, or an encoded config
}

// RequestVote RPC (Figure 2, §5.2, §5.4).
message RequestVoteRequest {
  uint64 term = 1;           // candidate's term
  string candidate_id = 2;   // candidate requesting vote
  uint64 last_log_index = 3; // index of candidate's last log entry
  uint64 last_log_term = 4;  // term of candidate's last log entry
}

message RequestVoteResponse {
  uint64 term = 1;       // currentTerm, for candidate to update itself
  bool vote_granted = 2; // true means candidate received vote
}

// AppendEntries RPC (Figure 2, §5.3). Also used as heartbeat when entries is empty.
message AppendEntriesRequest {
  uint64 term = 1;                // leader's term
  string leader_id = 2;           // so follower can redirect clients
  uint64 prev_log_index = 3;      // index of log entry immediately preceding new ones
  uint64 prev_log_term = 4;       // term of prev_log_index entry
  repeated LogEntry entries = 5;  // log entries to store (empty for heartbeat)
  uint64 leader_commit = 6;       // leader's commitIndex
}

message AppendEntriesResponse {
  uint64 term = 1;  // currentTerm, for leader to update itself
  bool success = 2; // true if follower contained entry matching prev_log_index and prev_log_term

  // Fast log backtracking on rejection (end of §5.3). Not part of Figure 2.
  uint64 conflict_term = 3;  // term of the conflicting entry, or 0 if the follower's log is too short
  uint64 conflict_index = 4; // first index the follower has for conflict_term, or its log length + 1
}
